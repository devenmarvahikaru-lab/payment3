<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dvnequity_ Payment Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        :root {
            --bg-main: #8b5e3c; 
            --card-match: #fdf5e6; 
            --accent-blue: #2563eb; 
            --radius-box: 24px;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-main);
            min-height: 100vh;
            display: flex; justify-content: center;
        }

        .app-frame {
            width: 100%; max-width: 480px; min-height: 100vh;
            background: var(--bg-main);
            position: relative; display: flex; flex-direction: column;
        }

        .header-top { padding: 30px 24px 10px; display: flex; justify-content: space-between; align-items: center; color: white; }
        
        .profile-area { padding: 20px 24px; text-align: center; color: white; }
        .p-img { width: 85px; height: 85px; border-radius: 50%; border: 3px solid var(--card-match); margin-bottom: 10px; object-fit: cover; background: #eee; }
        .p-info h2 { font-size: 22px; font-weight: 800; color: #fff; }

        .content-area { flex: 1; padding: 0 24px 100px; }
        .section-title { font-size: 12px; font-weight: 800; margin: 25px 0 12px; color: #fdf5e6; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .menu-card {
            background: var(--card-match); border-radius: var(--radius-box);
            padding: 20px; height: 130px; display: flex; flex-direction: column;
            justify-content: space-between; cursor: pointer; transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .menu-card:active { transform: scale(0.95); }
        .menu-card i { font-size: 32px; color: var(--accent-blue); }
        .menu-card h3 { font-size: 15px; font-weight: 800; color: var(--accent-blue); }
        .menu-card p { font-size: 10px; color: #5d4037; font-weight: 700; }

        .full-card { grid-column: span 2; height: 90px; flex-direction: row; align-items: center; gap: 15px; }

        .cs-floating {
            position: fixed; bottom: 30px; right: 20px; width: 60px; height: 60px;
            background: #25d366; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: white; font-size: 30px; z-index: 99;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1000; display: none; backdrop-filter: blur(4px);
        }
        .sheet {
            position: fixed; bottom: 0; width: 100%; max-width: 480px;
            background: var(--card-match); border-radius: 30px 30px 0 0; padding: 30px 24px;
            z-index: 1001; transform: translateY(100%); transition: 0.4s;
        }
        .sheet.active { transform: translateY(0); }

        .pay-item {
            background: #efe4d1; padding: 18px; border-radius: 18px;
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .pi-left h4 { font-size: 14px; font-weight: 800; color: var(--accent-blue); }
        .pi-left p { font-size: 13px; font-family: monospace; color: #5d4037; font-weight: 700; }
        .btn-copy { background: var(--accent-blue); color: white; border: none; padding: 10px 15px; border-radius: 10px; font-weight: 700; }

        .form-box input {
            width: 100%; padding: 16px; margin-bottom: 12px; border: 2px solid #efe4d1;
            border-radius: 15px; outline: none; font-size: 14px; background: white;
        }
        .btn-confirm {
            width: 100%; padding: 18px; background: var(--accent-blue);
            color: white; border: none; border-radius: 15px; font-weight: 800; cursor: pointer;
        }
        
        .qr-display {
            width: 100%; max-width: 300px; border-radius: 20px; 
            border: 4px solid #efe4d1; display: block; margin: 0 auto;
        }
    </style>
</head>
<body onclick="playClickSound()">

    <audio id="myAudio" loop autoplay>
        <source src="https://files.catbox.moe/2nsq9m.mp3" type="audio/mpeg">
    </audio>

    <audio id="clickSound">
        <source src="https://www.soundjay.com/buttons/sounds/button-16.mp3" type="audio/mpeg">
    </audio>

    <div class="app-frame">
        <div class="header-top">
            <i class="ri-menu-2-line" style="font-size: 24px;"></i>
            <div style="font-weight: 800; font-size: 14px;">dvnequity_</div>
            <i class="ri-verified-badge-fill" style="font-size: 24px; color: #3b82f6;"></i>
        </div>

        <div class="profile-area">
            <img src="foto.png" class="p-img">
            <div class="p-info">
                <h2>dvnequity_</h2>
                <p>Portal Pembayaran Resmi</p>
                <div style="margin-top:10px; display:flex; justify-content:center; gap:15px;">
                    <a href="https://www.instagram.com/dvnequity_/" target="_blank" style="color:white; font-size: 22px;"><i class="ri-instagram-line"></i></a>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="section-title">Metode Pembayaran</div>
            <div class="menu-grid">
                <div class="menu-card full-card" onclick="openModal('qris')">
                    <i class="ri-qr-scan-2-line"></i>
                    <div>
                        <h3>SCAN QRIS</h3>
                        <p>E-Wallet & Mobile Banking</p>
                    </div>
                </div>
                <div class="menu-card" onclick="openModal('ewallet')">
                    <i class="ri-wallet-3-line"></i>
                    <div>
                        <h3>E-WALLET</h3>
                        <p>DANA, GoPay, OVO</p>
                    </div>
                </div>
                <div class="menu-card" onclick="openModal('bank')">
                    <i class="ri-bank-line"></i>
                    <div>
                        <h3>BANK TRANSFER</h3>
                        <p>Coming Soon</p>
                    </div>
                </div>

                <div class="section-title" style="grid-column: span 2;">Layanan Pelanggan</div>
                
                <div class="menu-card full-card" onclick="openModal('confirm')">
                    <i class="ri-checkbox-circle-line"></i>
                    <div>
                        <h3>KONFIRMASI BAYAR</h3>
                        <p>Lapor jika sudah transfer dana</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="cs-floating" onclick="contactAdmin()">
            <i class="ri-whatsapp-line"></i>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div class="sheet" id="sheet">
        <div style="width:50px; height:6px; background:#efe4d1; border-radius:10px; margin: 0 auto 25px;"></div>
        <h3 id="sheetTitle" style="text-align:center; margin-bottom:25px; color: var(--accent-blue); font-weight: 800;">DETAIL</h3>
        <div id="sheetContent"></div>
    </div>

    <script>
        const myNum = "085175310130";
        const clickSound = document.getElementById('clickSound');

        function playClickSound() {
            clickSound.currentTime = 0;
            clickSound.play();
        }

        // Fungsi format Rupiah otomatis
        function formatRupiah(angka) {
            let number_string = angka.toString().replace(/[^,\d]/g, ''),
                split = number_string.split(','),
                sisa = split[0].length % 3,
                rupiah = split[0].substr(0, sisa),
                ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }

            return 'Rp ' + rupiah + ',00';
        }

        function openModal(mode) {
            const sheet = document.getElementById('sheet');
            const overlay = document.getElementById('overlay');
            const title = document.getElementById('sheetTitle');
            const content = document.getElementById('sheetContent');

            overlay.style.display = 'block';
            setTimeout(() => sheet.classList.add('active'), 10);

            if(mode === 'qris') {
                title.innerText = "SCAN QRIS";
                content.innerHTML = `<div style="text-align:center"><img src="qris.png" class="qr-display"></div>`;
            } else if(mode === 'ewallet') {
                title.innerText = "E-WALLET LIST";
                content.innerHTML = `
                    ${renderItem('DANA', 085175310130)}
                    ${renderItem('GoPay', 085175310130)}
                   ${renderItem('OVO', 085175310130)} 
                   ${renderItem('SHOPEEPAY', 085175310130)}
                `;
            } else if(mode === 'bank') {
                title.innerText = "TRANSFER BANK";
                content.innerHTML = `
                    ${renderItem('BCA', 'Coming Soon')}
                    ${renderItem('BRI', 'Coming Soon')}
                    ${renderItem('MANDIRI', 'Coming Soon')}
                `;
            } else if(mode === 'confirm') {
                title.innerText = "KONFIRMASI PEMBAYARAN";
                content.innerHTML = `
                    <div class="form-box">
                        <input type="text" id="fnama" placeholder="Nama Client">
                        <input type="number" id="fnominal" placeholder="Nominal (Contoh: 50000)">
                        <button class="btn-confirm" onclick="sendLaporan()">KIRIM KE WHATSAPP</button>
                    </div>
                `;
            }
        }

        function renderItem(name, value) {
            const isReady = value !== 'Coming Soon';
            return `
                <div class="pay-item">
                    <div class="pi-left">
                        <h4>${name}</h4>
                        <p id="copy_${name}">${value}</p>
                    </div>
                    ${isReady ? `<button class="btn-copy" onclick="doCopy('copy_${name}')">SALIN</button>` : ''}
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('sheet').classList.remove('active');
            setTimeout(() => document.getElementById('overlay').style.display = 'none', 400);
        }

        function doCopy(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text);
            alert("Nomor disalin!");
        }

        function sendLaporan() {
            const nama = document.getElementById('fnama').value;
            const nominalInput = document.getElementById('fnominal').value;
            
            if(!nama || !nominalInput) return alert("Mohon lengkapi data!");
            
            // Format nominal ke Rp 50.000,00
            const nominalTerformat = formatRupiah(nominalInput);
            
            const msg = `Halo admin dvnequity_, saya sudah transfer.%0A%0ANama: ${nama}%0ANominal: ${nominalTerformat}`;
            window.open(`https://wa.me/${+6285175310130}?text=${msg}`);
        }

        function contactAdmin() {
            window.open(`https://wa.me/${+6285175310130}?text=Halo admin dvnequity_, saya butuh bantuan.`);
        }

        window.onclick = function() {
            const a = document.getElementById('myAudio');
            if(a.paused) a.play();
            playClickSound();
        }
    </script>
</body>
</html>
